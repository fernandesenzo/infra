services:
  redis:
    image: redis:7.4.11-alpine3.21
    ports:
      - "127.0.0.1:6379:6379"
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD}
      - --maxmemory
      - 50mb
      - --maxmemory-policy
      - allkeys-lru
      - --maxmemory-samples
      - "10"
      - --save
      - "300"
      - "1"
    volumes:
      - redis_data:/data
    mem_limit: 200mb
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    networks:
      - infra_shortener
      - infra_napkin
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "3"

volumes:
  redis_data:

networks:
  infra_shortener:
    name: infra_shortener
  infra_napkin:
    name: infra_napkin
